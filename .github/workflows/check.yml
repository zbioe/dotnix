# hosts and homes evaluate without the GTK4 swap (checks/default.nix); full-iso
# needs the whole closure to evaluate (IFD): `nix flake check` covers it locally
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - name: Format, dead code, lint, Go tests, shellcheck
        run: nix build -L .#checks.x86_64-linux.{format,deadnix,statix,stylua,ruff,dotnix-key,usb-stick}
      - name: Evaluate the hosts, homes and the minimal ISO
        run: nix build -L .#checks.x86_64-linux.{system-bx,system-te,system-minimal-iso,home-bx,home-te}
      - name: USB key VM test
        run: nix build -L .#usb-key-test
      - name: Multiboot stick VM test
        run: nix build -L .#usb-stick-test
